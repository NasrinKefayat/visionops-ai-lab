[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visionops-ai"
version = "0.1.0"
description = "Modular video and medical image analysis platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "sphinx>=8,<9"]
ml = [
  "scikit-learn>=1.6,<2", "mlflow-skinny>=2.20,<3",
  "numpy>=2,<3", "opencv-python-headless>=4.10,<5",
  "PyYAML>=6,<7", "joblib>=1.4,<2",
]
torch = ["torch>=2.6,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/visionops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
