services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    environment:
      VISIONOPS_API_PROXY_TARGET: http://backend:8000
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
# Development scaffold only; durable storage and production serving come later.
